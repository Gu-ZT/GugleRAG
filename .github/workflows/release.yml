name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare release
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      changelog_version: ${{ steps.identity.outputs.changelog_version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate tag, manifests, and changelogs
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node ci/check-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node ci/check-version.mjs
          fi
      - name: Resolve release identity
        id: identity
        run: >-
          node ci/release-identity.mjs
          --ref-type "$GITHUB_REF_TYPE"
          --ref-name "$GITHUB_REF_NAME"
          --run-number "$GITHUB_RUN_NUMBER"
          --github-output "$GITHUB_OUTPUT"
      - name: Create or reuse draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.identity.outputs.tag }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        run: |
          RELEASE_ID=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
              -f target_commitish="$SHA" \
              -f name="GugleRAG $TAG" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --silent
          else
            RELEASE_ID=$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$SHA" \
              -f name="GugleRAG $TAG" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq .id)
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            executable: target/x86_64-unknown-linux-gnu/release/GugleRAG
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            executable: target/aarch64-unknown-linux-gnu/release/GugleRAG
          - platform: windows
            arch: x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            executable: target/x86_64-pc-windows-msvc/release/GugleRAG.exe
          - platform: windows
            arch: aarch64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            executable: target/aarch64-pc-windows-msvc/release/GugleRAG.exe
          - platform: macos
            arch: aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            executable: target/aarch64-apple-darwin/release/GugleRAG
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            executable: target/x86_64-apple-darwin/release/GugleRAG
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build release server
        run: cargo build --release --locked --target ${{ matrix.rust_target }}
      - name: Verify native binary architecture
        run: >-
          node ci/verify-binary.mjs
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --binary "${{ matrix.executable }}"
          --native
      - name: Smoke-test release server
        run: node ci/smoke-server.mjs "${{ matrix.executable }}"
      - name: Assemble portable package
        run: >-
          node ci/assemble-release.mjs
          --version "${{ needs.prepare.outputs.version }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --binary "${{ matrix.executable }}"
      - name: Archive package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          root="GugleRAG-v${VERSION}-${PLATFORM}-${ARCH}"
          archive="guglerag-v${VERSION}-${PLATFORM}-${ARCH}.tar.gz"
          tar -C release/stage -czf "release/${archive}" "$root"
          cd release
          shasum -a 256 "$archive" > "${archive}.sha256"
      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          $root = "GugleRAG-v$env:VERSION-$env:PLATFORM-$env:ARCH"
          $archive = "guglerag-v$env:VERSION-$env:PLATFORM-$env:ARCH.zip"
          Compress-Archive -LiteralPath "release/stage/$root" -DestinationPath "release/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "release/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "release/$archive.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
      - name: Upload files to draft release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release/*.tar.gz release/*.sha256 --clobber
      - name: Upload files to draft release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $files = Get-ChildItem release -File | ForEach-Object FullName
          gh release upload $env:TAG $files --clobber

  docker-build:
    name: Container (${{ matrix.arch }})
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Normalize container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish Debian container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}

  docker:
    name: Publish container manifest
    needs: [prepare, docker-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Normalize container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=main,enable=${{ needs.prepare.outputs.prerelease == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-architecture container image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${IMAGE}:${SOURCE_TAG}-amd64" \
              "${IMAGE}:${SOURCE_TAG}-arm64"
          done <<< "$TAGS"
      - name: Inspect multi-architecture container image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

  update-release-notes:
    name: Publish release notes
    needs: [prepare, build, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Render bilingual release notes
        run: >-
          node ci/release-notes.mjs
          --version "${{ needs.prepare.outputs.version }}"
          --changelog-version "${{ needs.prepare.outputs.changelog_version }}"
          --artifacts artifacts
          --repository "${{ github.repository }}"
          --output release-notes.md
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: >-
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID"
          -F body=@release-notes.md
          -F draft=false
          -F prerelease="$PRERELEASE"
          --silent
